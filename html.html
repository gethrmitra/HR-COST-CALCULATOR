<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Get HR Mitra · HR Cost &amp; Efficiency Analyzer</title>
<!--HRM_CONFIG-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --ink:#141B34; --ink2:#465071; --ink3:#69738F;
  --paper:#F3F4FB; --surface:#FFFFFF; --sunk:#ECEEF8; --line:#DBDFEE;
  --focus:#0B62D6;
  --shadow:0 1px 2px rgba(20,27,52,.05),0 14px 30px -16px rgba(40,40,110,.22);
  --s0:#0284C7; --s1:#7C3AED; --s2:#0D9488; --s3:#EA580C; --s4:#E11D48; --s5:#0B3D91;
  --people:#2563EB; --tech:#0D9488; --vendor:#7C3AED; --manual:#F59E0B; --leak:#E11D48; --fee:#0B3D91;
  --good:#047857; --bad:#BE123C; --warnbg:#FFF4D6; --warnink:#7A4A00;
  --grad:linear-gradient(135deg,#0B62D6 0%,#1AA7E8 100%);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ink:#EEF0FA; --ink2:#B9C0D8; --ink3:#8E98B4;
    --paper:#0D1225; --surface:#151B34; --sunk:#1D2544; --line:#2B3560;
    --focus:#7DC4FF;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 30px -16px rgba(0,0,0,.65);
    --s0:#5CC8FF; --s1:#B18CFF; --s2:#3CD3C0; --s3:#FF9A5C; --s4:#FF6B8B; --s5:#7FB0FF;
    --people:#6EA0FF; --tech:#3CD3C0; --vendor:#B18CFF; --manual:#FFB84D; --leak:#FF6B8B; --fee:#7FB0FF;
    --good:#4ADE9C; --bad:#FF8FA6; --warnbg:#3A2A0E; --warnink:#F3C980;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ink:#EEF0FA; --ink2:#B9C0D8; --ink3:#8E98B4;
  --paper:#0D1225; --surface:#151B34; --sunk:#1D2544; --line:#2B3560;
  --focus:#7DC4FF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 30px -16px rgba(0,0,0,.65);
  --s0:#5CC8FF; --s1:#B18CFF; --s2:#3CD3C0; --s3:#FF9A5C; --s4:#FF6B8B; --s5:#7FB0FF;
  --people:#6EA0FF; --tech:#3CD3C0; --vendor:#B18CFF; --manual:#FFB84D; --leak:#FF6B8B; --fee:#7FB0FF;
  --good:#4ADE9C; --bad:#FF8FA6; --warnbg:#3A2A0E; --warnink:#F3C980;
}
html{background:var(--paper);scroll-padding-top:calc(env(safe-area-inset-top,0px) + 96px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,.disp{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif;letter-spacing:-0.015em;line-height:1.12;margin:0}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
main:focus,h2:focus{outline:none}
.shell{max-width:1200px;margin:0 auto;padding:0 20px}

/* icons */
.ic{width:20px;height:20px;display:block}
.ibx{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:11px;flex:none;color:var(--c);background:var(--sunk);background:color-mix(in srgb,var(--c) 15%,transparent)}
.ibx.lg{width:54px;height:54px;border-radius:17px;color:#fff;background:var(--c);box-shadow:0 10px 22px -10px var(--c)}
.ibx.lg .ic{width:27px;height:27px}

/* banner */
.banner{margin-top:16px;border-radius:26px;padding:30px 34px 32px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(125deg,#031430 0%,#06234F 55%,#0A4A9C 100%);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.banner::before{content:"";position:absolute;right:-90px;top:-120px;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(245,184,25,.5),transparent 65%)}
.banner::after{content:"";position:absolute;left:38%;bottom:-190px;width:460px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(26,167,232,.42),transparent 65%)}
.banner>*{position:relative;z-index:1}
.logo{display:inline-flex;align-items:center;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 14px 30px -14px rgba(0,0,0,.6)}
.logo:has(.wm){padding:8px 16px;min-height:48px}
.logo img{height:88px;width:auto;max-width:100%;display:block}
@media (max-width:520px){.logo img{height:58px}}
.brandbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:22px}
.logo{box-shadow:0 10px 26px -14px rgba(3,20,48,.55);border:1px solid var(--line)}
.bb-links{display:flex;gap:10px;flex-wrap:wrap}
.bb-links a{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;font-size:.9rem;padding:9px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.bb-links .ic{width:16px;height:16px;color:var(--s0)}
@media (max-width:640px){.bb-links a span{display:none}.bb-links a{padding:10px}}
.wm{display:inline-flex;align-items:center;gap:10px;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:1.2rem;color:#06234F;letter-spacing:-0.01em}
.wm i{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--grad);color:#fff}
.wm i .ic{width:17px;height:17px}
.banner h1{margin-top:0;font-size:clamp(2rem,4.6vw,3.2rem);font-weight:700;max-width:20ch}
.pills{list-style:none;padding:0;margin:18px 0 0;display:flex;flex-wrap:wrap;gap:10px}
.pills li{display:inline-flex;align-items:center;gap:9px;padding:7px 14px 7px 11px;border-radius:999px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);font-weight:600;font-size:.95rem;backdrop-filter:blur(6px)}
.pills i{width:9px;height:9px;border-radius:50%}
.banner .sub{margin-top:14px;color:rgba(255,255,255,.82);max-width:64ch}

/* step nav */
.steps{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);padding:14px 0 12px;margin-bottom:20px}
.steps ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.steps button{width:100%;text-align:left;background:none;border:0;border-top:4px solid var(--line);padding:9px 0 0;display:flex;align-items:center;gap:9px;color:var(--ink3);font-weight:600;font-size:.9rem;line-height:1.2}
.steps .ibx{width:32px;height:32px;border-radius:10px}
.steps .ibx .ic{width:17px;height:17px}
.steps small{display:block;font-weight:500;font-size:.74rem;color:var(--ink3)}
.steps button.done{border-top-color:var(--c);color:var(--ink2)}
.steps button[aria-current="step"]{border-top-color:var(--c);color:var(--ink)}
.steps button[aria-current="step"] .ibx{color:#fff;background:var(--c);box-shadow:0 8px 16px -8px var(--c)}
@media (max-width:820px){
  .steps ol{gap:6px}
  .steps button{flex-direction:column;align-items:flex-start;gap:6px}
  .steps .nm{display:none}
}
.steps .cur-name{display:none}
@media (max-width:820px){.steps .cur-name{display:block;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;margin:8px 0 0;font-size:1.02rem}}

/* layout */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:36px;align-items:start;padding-bottom:70px}
body.is-dash .layout{grid-template-columns:minmax(0,1fr)}
body.is-dash .rail{display:none}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 100px);color:#fff;border-radius:22px;padding:22px;background:linear-gradient(160deg,#031430 0%,#06234F 55%,#0A4A9C 100%);box-shadow:0 22px 40px -22px rgba(3,20,48,.75)}
.rail-l{color:rgba(255,255,255,.72);font-weight:600;font-size:.85rem}
.rail-v{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:2.6rem;line-height:1.05;margin-top:4px;letter-spacing:-0.02em;font-variant-numeric:tabular-nums}
.rail-v span{font-size:1rem;font-weight:500;color:rgba(255,255,255,.75);letter-spacing:0}
.rail-s{color:rgba(255,255,255,.8);font-size:.92rem;margin-top:6px}
.rail-list{list-style:none;padding:0;margin:18px 0;display:grid;gap:10px}
.rail-list li{display:flex;align-items:center;gap:10px;font-size:.92rem}
.rail-list b{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600}
.sw{width:12px;height:12px;border-radius:4px;flex:none;display:inline-block}
.rail .btn{width:100%;background:#fff;color:#06234F;box-shadow:none}
@media (max-width:960px){
  .layout{grid-template-columns:minmax(0,1fr);gap:0;padding-bottom:110px}
  .rail{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:40;border-radius:20px 20px 0 0;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:14px}
  .rail-l,.rail-list,.rail-s{display:none}
  .rail-v{font-size:1.6rem;margin:0;flex:1}
  .rail .btn{width:auto;flex:none;padding:10px 16px}
}

/* content */
.ph{display:flex;gap:16px;align-items:center;margin-bottom:22px}
.ph h2{font-size:clamp(1.6rem,3.2vw,2.3rem);font-weight:700}
.lede{color:var(--ink2);margin-top:6px;max-width:64ch}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px;padding:10px 14px;border-radius:14px;background:var(--warnbg);color:var(--warnink);font-size:.9rem}
.toolbar p{flex:1 1 260px;display:flex;gap:10px;align-items:center}
.toolbar p .ic{width:18px;height:18px;flex:none}
.toolbar button{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:6px 12px;font-weight:600;font-size:.85rem}
.card{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px;margin-bottom:20px;box-shadow:var(--shadow)}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,var(--cardc,var(--step)),transparent 75%)}
.card h3{display:flex;align-items:center;gap:12px;font-size:1.25rem;font-weight:700;margin-bottom:6px}
.card .desc{color:var(--ink2);font-size:.94rem;margin:0 0 18px;max-width:70ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.lab{font-weight:600;font-size:.9rem}
.hint{color:var(--ink3);font-size:.8rem;line-height:1.35}
.inp{display:flex;align-items:center;border:1.5px solid var(--line);background:var(--surface);border-radius:11px;transition:border-color .15s,box-shadow .15s}
.inp:focus-within{border-color:var(--focus);box-shadow:0 0 0 4px color-mix(in srgb,var(--focus) 18%,transparent)}
.inp input{border:0;background:transparent;flex:1;min-width:0;padding:11px 12px;font:inherit;color:inherit;outline:none;font-variant-numeric:tabular-nums}
.pre,.suf{color:var(--ink3);font-size:.9rem;padding:0 0 0 12px;font-weight:600}
.suf{padding:0 12px 0 0;font-weight:500}
select{font:inherit;color:inherit;background:var(--surface);border:1.5px solid var(--line);border-radius:11px;padding:11px 12px;width:100%}
.ti{width:100%;min-width:76px;border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px;font:inherit;color:inherit;font-variant-numeric:tabular-nums}
.ti:focus{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 18%,transparent)}
.tblw{overflow-x:auto;margin:0 -4px}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:520px}
.tbl th,.tbl td{padding:9px 6px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl thead th{font-size:.8rem;color:var(--ink3);font-weight:600}
.tbl tbody th{font-weight:500}
.tbl .n{text-align:right;white-space:nowrap}
.tbl tfoot th,.tbl tfoot td{font-weight:700;border-bottom:0;border-top:1px solid var(--line)}
.tbl tfoot tr:first-child th,.tbl tfoot tr:first-child td{border-top:2px solid var(--cardc,var(--step))}
.tbl td.c-in{width:150px}
.tbl td.c-sel{width:190px}
.tag-s{display:inline-block;font-size:.72rem;font-weight:600;color:var(--ink2);background:var(--sunk);padding:1px 8px;border-radius:999px;margin-left:8px;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:20px}
.stat{border-radius:14px;padding:13px 15px;display:flex;flex-direction:column;gap:2px;background:var(--sunk);background:color-mix(in srgb,var(--cardc,var(--step)) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--cardc,var(--step)) 22%,var(--line))}
.stat-l{font-size:.8rem;color:var(--ink2)}
.stat-v{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:1.4rem;font-variant-numeric:tabular-nums;letter-spacing:-0.01em;color:var(--cardc,var(--step))}
.stat-n{font-size:.78rem;color:var(--ink3)}
.note{margin-top:14px;font-size:.88rem;color:var(--ink2)}
.note.warn{background:var(--warnbg);color:var(--warnink);padding:10px 14px;border-radius:10px}
.formula{margin-top:12px;font-size:.9rem;color:var(--ink2)}
.formula b{color:var(--ink);font-variant-numeric:tabular-nums}
.target{margin-top:16px;font-size:.92rem;color:var(--ink2);padding:11px 14px;border-radius:12px;background:var(--sunk);background:color-mix(in srgb,var(--s2) 10%,var(--surface))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;background:var(--grad);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-weight:600;text-decoration:none;text-align:center;box-shadow:0 12px 22px -12px #0B62D6;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.btn .ic{width:18px;height:18px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.navbtns{display:flex;justify-content:space-between;gap:12px;margin-top:8px}

/* dashboard */
.herocard{display:grid;grid-template-columns:minmax(240px,320px) 1fr;gap:34px;align-items:center;margin:8px 0 22px;padding:30px;border-radius:26px;border:1px solid var(--line);box-shadow:var(--shadow);background:radial-gradient(600px 300px at 0 0,color-mix(in srgb,var(--s5) 12%,transparent),transparent 70%),radial-gradient(500px 300px at 100% 100%,color-mix(in srgb,var(--s3) 12%,transparent),transparent 70%),var(--surface)}
@media (max-width:760px){.herocard{grid-template-columns:1fr;padding:22px}}
.ring{width:100%;height:auto;display:block;max-width:340px;margin:0 auto}
.ring circle{fill:none}
.ring .trk{stroke:var(--sunk)}
.ring text{font-family:"Bricolage Grotesque",sans-serif;fill:var(--ink)}
.ring .rt-s{font-size:12px;fill:var(--ink3);font-family:"Figtree",sans-serif}
.ring .rt-v{font-size:30px;font-weight:700;letter-spacing:-0.02em}
.sweep{animation:sweep 1s cubic-bezier(.3,.7,.2,1) both}
@keyframes sweep{from{stroke-dashoffset:var(--c)}}
@media (prefers-reduced-motion:reduce){.sweep{animation:none}}
.hero-h{font-size:clamp(2rem,5vw,3.4rem);font-weight:700}
.hero-h .amt{background:linear-gradient(100deg,var(--s5),#1AA7E8);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.hero-p{margin-top:12px;font-size:1.06rem;color:var(--ink2);max-width:52ch}
.legend{list-style:none;padding:0;margin:20px 0 0;display:grid;gap:11px}
.legend li{display:grid;grid-template-columns:14px 1fr auto;gap:12px;align-items:start}
.legend .sw{margin-top:5px}
.legend b{display:block;font-weight:600}
.legend .d{display:block;font-size:.82rem;color:var(--ink3)}
.legend .a{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.legend .a span{display:block;font-weight:500;font-size:.8rem;color:var(--ink3)}
.kt{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px}
.kti{display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:18px;background:var(--surface);background:color-mix(in srgb,var(--c) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 24%,var(--line))}
.kti span.l{display:block;font-size:.8rem;color:var(--ink2)}
.kti b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:1.65rem;line-height:1.1;font-variant-numeric:tabular-nums;color:var(--c);margin:2px 0}
.kti em{font-style:normal;font-size:.8rem;color:var(--ink3)}
.hcompare{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:14px 0 4px}
@media (max-width:640px){.hcompare{grid-template-columns:1fr}}
.hc-panel{border-radius:18px;padding:20px 22px;border:1px solid var(--line);background:var(--surface)}
.hc-panel.cur{border-top:4px solid var(--ink3)}
.hc-panel.hrm{border-top:4px solid var(--s0);background:linear-gradient(160deg,color-mix(in srgb,var(--s0) 10%,var(--surface)),var(--surface))}
.hc-panel .hc-l{font-size:.82rem;color:var(--ink2);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.hc-panel .hc-v{font-family:"Bricolage Grotesque",sans-serif;font-size:2.3rem;line-height:1.15;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.hc-panel .hc-s{font-size:.86rem;color:var(--ink2)}
.adminlink{position:fixed;top:10px;right:14px;z-index:50;font-size:.78rem;color:var(--ink2);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 13px;cursor:pointer;box-shadow:var(--shadow)}
.adminlink.on{color:var(--good);border-color:var(--good)}
.modal-ov{position:fixed;inset:0;background:rgba(10,14,28,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal-box{background:var(--surface);border-radius:20px;padding:26px 26px 22px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal-box h3{margin:0 0 4px}
.modal-box label{display:block;font-size:.82rem;color:var(--ink2);margin-top:12px;margin-bottom:4px}
.modal-box input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;font-size:.95rem}
.modal-box .err{color:var(--bad);font-size:.85rem;margin-top:10px}
.adminpanel{border:2px dashed var(--s0);border-radius:20px;padding:18px 20px;margin-bottom:20px;background:color-mix(in srgb,var(--s0) 6%,var(--surface))}
.adminrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.adminrow:last-of-type{border-bottom:none}
.adminrow .lbl{flex:1;font-size:.92rem}
.adminrow button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:.85rem}
.adminrow button:disabled{opacity:.3;cursor:default}
.savetoast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--ink);color:#fff;padding:9px 18px;border-radius:999px;font-size:.82rem;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:60;box-shadow:var(--shadow);display:flex;align-items:center;gap:7px}
.savetoast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.savetoast svg{width:15px;height:15px;flex:none}
.eq{display:flex;flex-wrap:wrap;gap:12px 14px;align-items:center}
.eq>div{display:flex;flex-direction:column;min-width:104px;border-left:4px solid var(--c);padding-left:12px}
.eq span{font-size:.8rem;color:var(--ink2)}
.eq b{font-family:"Bricolage Grotesque",sans-serif;font-size:1.4rem;font-variant-numeric:tabular-nums}
.eq i{font-style:normal;color:var(--ink3);font-size:1.4rem}
.eq .tot b{font-size:1.65rem;color:var(--c)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 40px;margin:0}
@media (max-width:700px){.kpis{grid-template-columns:1fr}}
.kpis>div{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.kpis dt{color:var(--ink2);font-size:.94rem}
.kpis dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.sec-h{display:flex;align-items:center;gap:14px;margin:38px 0 8px}
.sec-h h2{font-size:1.7rem;font-weight:700}
.builder{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:26px 30px}
.builder fieldset{border:0;padding:0;margin:0;min-width:0}
.builder legend{font-weight:700;font-size:.95rem;padding:0;margin-bottom:10px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:.94rem;cursor:pointer}
.chk input{margin-top:4px;width:18px;height:18px;accent-color:var(--s5)}
.retain{display:grid;grid-template-columns:1fr 84px;gap:8px 10px;align-items:center;font-size:.92rem}
.bars{display:grid;gap:12px;margin:6px 0 10px}
.bar-row{display:grid;grid-template-columns:118px 1fr 78px;gap:12px;align-items:center;font-size:.9rem}
.bar-row .bar-l{font-weight:600}
.bar-v{text-align:right;font-variant-numeric:tabular-nums}
.bar{display:flex;height:32px;background:var(--sunk);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%}
.keys{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--ink2);margin-bottom:18px}
.keys span{display:inline-flex;align-items:center;gap:6px}
.diffs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:22px 0}
.diff{border-radius:16px;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--dc,var(--s5))}
.diff span{font-size:.82rem;color:var(--ink2);display:block}
.diff b{font-family:"Bricolage Grotesque",sans-serif;font-size:1.7rem;font-variant-numeric:tabular-nums;display:block;margin:2px 0}
.diff em{font-style:normal;font-size:.82rem;font-weight:600}
.good{color:var(--good)} .bad{color:var(--bad)}
.cmp td.n,.cmp th.n{text-align:right}
.cmp tbody td.mute{color:var(--ink3)}
.cta{display:flex;flex-wrap:wrap;gap:18px 28px;align-items:center;justify-content:space-between;border-radius:24px;padding:30px 32px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(125deg,#031430 0%,#06234F 55%,#0A4A9C 100%);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.cta::before{content:"";position:absolute;right:-70px;top:-110px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(245,184,25,.45),transparent 65%)}
.cta>*{position:relative}
.cta h3{font-size:1.5rem;max-width:26ch}
.cta p{margin-top:6px;color:rgba(255,255,255,.85);max-width:48ch}
.cta .row{display:flex;gap:10px;flex-wrap:wrap}
.cta .btn{background:#fff;color:#06234F;box-shadow:none}
.cta .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.55)}
.prep{display:inline-flex;align-items:center;gap:10px;margin:0 0 18px;padding:6px 8px 6px 16px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);font-weight:600;font-size:.9rem;max-width:100%}
.prep input{border:0;background:transparent;font:inherit;font-weight:700;color:var(--ink);min-width:220px;max-width:100%;outline:none;padding:6px 8px}
.prep:focus-within{border-color:var(--focus)}
.seg{display:inline-flex;padding:4px;border-radius:12px;background:var(--sunk);gap:4px;margin-bottom:16px}
.seg button{border:0;background:transparent;padding:8px 20px;border-radius:9px;font-weight:600;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--grad);color:#fff;box-shadow:0 8px 16px -10px #0B62D6}
.svc{display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:10px;align-items:start;padding:3px 0}
.svc .ti{margin-top:4px}
.cmp .sub th{font-size:.78rem;letter-spacing:.02em;text-transform:uppercase;color:var(--ink3);background:var(--sunk);border-bottom:0;padding:6px}
.yrchart{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;height:230px;margin:22px 0 8px}
.yc{display:flex;flex-direction:column;height:100%;align-items:center;gap:8px}
.yb{display:flex;align-items:flex-end;gap:6px;width:100%;justify-content:center;flex:1;min-height:0;border-bottom:2px solid var(--line)}
.yb i{display:block;width:38%;max-width:56px;border-radius:8px 8px 2px 2px;min-height:2px}
.yl{font-size:.8rem;color:var(--ink2);font-weight:600}
.savebar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:16px}
.savestat{font-size:.92rem;font-weight:600}
.savestat.good{color:var(--good)} .savestat.bad{color:var(--bad)}
.linkbtn{border:0;background:none;color:var(--focus);font-weight:600;text-decoration:underline;padding:0}
.fine{font-size:.8rem;color:var(--ink3);margin-top:14px;max-width:80ch}

@media print{
  html,body{background:#fff}
  .steps,.rail,.toolbar,.navbtns,.no-print,.banner .sub{display:none !important}
  .layout{display:block}
  .card,.herocard{break-inside:avoid}
}
</style>
</head>

function merge(b,s){
  if(Array.isArray(b)){return Array.isArray(s)?b.map(function(x,i){return i<s.length?merge(x,s[i]):x}):b}
  if(b&&typeof b==='object'){var out={};for(var k in b){out[k]=(s&&typeof s==='object'&&k in s)?merge(b[k],s[k]):b[k]}return out}
  return typeof s===typeof b?s:b;
}
function zero(o){

}

/* ---------- number formatting (Indian grouping) ---------- */
var nf=function(v,d){return Number(v).toLocaleString('en-IN',{maximumFractionDigits:d||0})};
var inr=function(v){return (v<0?'−':'')+'₹'+nf(Math.abs(Math.round(v)))};
function short(v){
  var a=Math.abs(v),s=v<0?'−':'';
  if(a>=1e7)return s+'₹'+nf(a/1e7,2)+' Cr';
  if(a>=1e5)return s+'₹'+nf(a/1e5,a<1e6?2:1)+' L';
  return s+'₹'+nf(Math.round(a));
}
function long(v){
  var a=Math.abs(v),s=v<0?'−':'';
  if(a>=1e7)return s+'₹'+nf(a/1e7,2)+' Crore';
  if(a>=1e5)return s+'₹'+nf(a/1e5,a<1e6?2:1)+' Lakh';
  return s+'₹'+nf(Math.round(a));
}
var FM={
  inr:inr,short:short,
  num1:function(v){return nf(v,1)},
  int:function(v){return nf(v,0)},
  pct:function(v){return nf(v,1)+'%'},
  hrs:function(v){return nf(v,1)+' hrs'},
  days:function(v){return nf(v,0)+(Math.round(v)===1?' day':' days')},
  text:function(v){return v==null?'':v}
};
function fmt(f,v){
  if(v==null||(typeof v==='number'&&!isFinite(v)))return f==='text'?'':'—';
  return (FM[f]||inr)(v);
}


/* ---------- calculations ---------- */
function compute(s){
  var n=function(v){v=+v;return isFinite(v)?v:0};
  var o=s.org,emp=n(o.employees),fte=n(s.fte)||160,C={};

  // people
  C.roleM=s.roles.map(function(r){return n(r.hc)*n(r.cost)});
  C.roleY=C.roleM.map(function(x){return x*12});
  C.rolesHC=sum(s.roles.map(function(r){return n(r.hc)}));
  C.salaryM=sum(C.roleM);C.salaryY=C.salaryM*12;
  C.opsM=C.salaryM+n(s.otherHR);C.opsY=C.opsM*12;
  C.hourly=C.rolesHC>0?C.opsM/(C.rolesHC*fte):0;
  C.hrRatio=n(o.hrHeads)>0?emp/n(o.hrHeads):null;
  C.ratioText=(n(o.hrHeads)>0&&emp>0)?nf(emp)+' employees ÷ '+nf(o.hrHeads)+' HR = '+nf(C.hrRatio,1)+' employees per HR person':'';
  C.exitsAnn=emp>0?n(o.exits)*12/emp*100:null;
  C.warnHC=(C.rolesHC!==n(o.hrHeads))?'Step 1 lists '+nf(o.hrHeads)+' HR employees, but the roles below add up to '+nf(C.rolesHC)+'. The role table drives the cost, so update whichever is out of date.':'';

  // recruitment
  var hires=n(o.hires);C.hires=hires;
  C.agencyHires=hires*n(s.rec.agencyPct)/100;
  C.agencyM=C.agencyHires*n(s.rec.agencyFee);
  C.portalM=n(s.rec.portal);
  C.bgvM=hires*n(s.rec.bgv);
  C.recM=C.agencyM+C.portalM+C.bgvM;C.recY=C.recM*12;
  C.recruiterM=C.roleM[3]||0;
  C.cphExt=hires>0?C.recM/hires:null;
  C.cphFull=hires>0?(C.recM+C.recruiterM)/hires:null;

  // technology
  C.techRowM=s.tech.map(function(t){return t.m==='fixed'?n(t.c):n(t.c)*emp});
  C.techRowY=C.techRowM.map(function(x){return x*12});
  C.techM=sum(C.techRowM);C.techY=C.techM*12;
  C.techPerEmp=emp>0?C.techY/emp:null;
  C.techPerEmpM=emp>0?C.techM/emp:null;
  C.techNote=emp>0?'Per-employee rates are multiplied by '+nf(emp)+' employees from Step 1.':'Enter total employees in Step 1 so per-employee rates can be calculated.';
  C.techHeadM=sum(s.tech.map(function(t){return t.m==='fixed'?0:n(t.c)*emp}));
  C.techFixM=C.techM-C.techHeadM;
  C.hrmsManM=n(s.techMan)*emp;

  // vendors
  var v=s.vend;
  C.payM=n(v.payFixed)+n(v.payPerEmp)*emp;C.payY=C.payM*12;
  C.compM=n(v.compFixed)+n(v.compPerEmp)*emp+n(v.compAnnual)/12;C.compY=C.compM*12;
  C.otherM=n(v.other);C.otherY=C.otherM*12;
  C.payText=inr(n(v.payFixed))+' fixed + '+inr(n(v.payPerEmp))+' × '+nf(emp)+' employees = '+inr(C.payM)+' a month';
  C.compText=inr(n(v.compFixed))+' fixed + '+inr(n(v.compPerEmp))+' × '+nf(emp)+' employees + '+inr(n(v.compAnnual))+' ÷ 12 = '+inr(C.compM)+' a month';
  C.vendorNoRecM=C.payM+C.compM+C.otherM;C.vendorNoRecY=C.vendorNoRecM*12;

  // queries, compliance, payroll efficiency
  C.qHours=n(s.q.count)*n(s.q.mins)/60;
  C.qCostM=C.qHours*C.hourly;C.qCostY=C.qCostM*12;
  C.resp=n(s.q.resp);
  C.compHours=n(s.comp.hours);
  C.compIntM=C.compHours*C.hourly;
  C.compMgmtY=(C.compM+C.compIntM)*12;
  C.compManualPct=n(s.comp.acts)>0?Math.min(n(s.comp.manual)/n(s.comp.acts)*100,100):null;
  C.gapDays=(n(s.pay.closeDay)>0&&n(s.pay.inputDay)>=n(s.pay.closeDay))?n(s.pay.inputDay)-n(s.pay.closeDay):null;
  C.corrPer100=emp>0?n(s.pay.corr)/emp*100:null;
  C.intervPer100=emp>0?n(s.pay.interv)/emp*100:null;

  // manual work
  C.manualEdit=sum(s.manual.map(function(m){return n(m.h)}));
  C.manualHours=C.manualEdit+C.qHours+C.compHours;C.manualHoursY=C.manualHours*12;
  C.manualCostRaw=C.manualHours*C.hourly;
  C.manualCost=Math.min(C.manualCostRaw,C.opsM);
  C.manualCostY=C.manualCost*12;
  C.capacityPct=C.rolesHC>0?C.manualHours/(C.rolesHC*fte)*100:null;

  // workforce data leakage
  var L=s.leak;
  C.varM=n(o.gross)*n(L.varPct)/100;
  C.corrM=n(s.pay.corr)*n(L.corrCost);
  C.empHourly=emp>0?n(o.gross)/emp/fte:0;
  C.lostM=n(L.lostHrs)*C.empHourly;
  C.penM=n(s.comp.penalties)/12;
  C.leakM=C.varM+C.corrM+C.lostM+C.penM;C.leakY=C.leakM*12;

  // buckets (no double counting: manual work is a slice of internal HR cost)
  C.internalM=C.opsM+C.portalM+C.bgvM+C.hrmsManM;
  C.vendorM=C.payM+C.compM+C.agencyM+C.otherM;
  C.vendorY=C.vendorM*12;
  C.totalM=C.internalM+C.techM+C.vendorM+C.leakM;C.totalY=C.totalM*12;
  C.perEmpM=emp>0?C.totalM/emp:null;C.perEmpY=emp>0?C.totalY/emp:null;
  C.people=Math.max(C.internalM-C.manualCost,0);
  C.internalY=C.internalM*12;

  // scenario
  var sc=s.scn,vv=s.vend;
  C.svc=SVC.map(function(x){var on=!!sc.inc[x.k],r=n(sc.rates[x.k]);return {k:x.k,l:x.l,on:on,rate:r,m:on?r*emp:0}});
  C.perHeadRate=sum(C.svc.map(function(x){return x.on?x.rate:0}));
  C.feeTotal=sum(C.svc.map(function(x){return x.m}))+n(sc.addOn);
  C.feeText=emp>0?nf(emp)+' employees × ₹'+nf(C.perHeadRate,2)+' a head'+(n(sc.addOn)>0?' plus '+inr(n(sc.addOn))+' fixed':''):'Enter employees in Step 1';
  var retHC=s.roles.map(function(r,i){return Math.min(n(sc.retained[i]),n(r.hc))});
  C.retHC=sum(retHC);
  C.retSalary=sum(retHC.map(function(h,i){return h*n(s.roles[i].cost)}));
  C.retOther=C.rolesHC>0?n(s.otherHR)*C.retHC/C.rolesHC:0;
  var L=[];
  function add(k,l,cf,ch,pf,ph,fee){L.push({k:k,l:l,cf:cf,ch:ch,pf:pf,ph:ph,fee:!!fee,cur:cf+ch,prop:pf+ph})}
  var scale=!!sc.scaleTeam,opsP=sc.scope.ops?C.retSalary+C.retOther:C.opsM;
  add('ops','In-house HR team',scale?0:C.opsM,scale?C.opsM:0,scale?0:opsP,scale?opsP:0);
  var keepTech=Math.min(n(sc.techKeep),C.techM);
  add('tech','HRMS and HR technology',C.techFixM,C.techHeadM,sc.scope.tech?keepTech:C.techFixM,sc.scope.tech?0:C.techHeadM);
  add('hrms','Extra manpower to run in-house HRMS',0,C.hrmsManM,0,sc.scope.tech?0:C.hrmsManM);
  var payH=n(vv.payPerEmp)*emp;
  add('payroll','Payroll vendor',n(vv.payFixed),payH,sc.scope.payroll?0:n(vv.payFixed),sc.scope.payroll?0:payH);
  var compF=n(vv.compFixed)+n(vv.compAnnual)/12,compH=n(vv.compPerEmp)*emp;
  add('compliance','Compliance vendor and consulting',compF,compH,sc.scope.compliance?0:compF,sc.scope.compliance?0:compH);
  add('recruit','Recruitment',C.portalM,C.agencyM+C.bgvM,sc.scope.recruit?0:C.portalM,sc.scope.recruit?0:C.agencyM+C.bgvM);
  add('other','Other HR vendors',C.otherM,0,sc.scope.other?0:C.otherM,0);
  var cut=1-Math.min(n(sc.leakCut),100)/100;
  add('leak','Workforce data leakage',C.penM,C.leakM-C.penM,C.penM*cut,(C.leakM-C.penM)*cut);
  C.svc.forEach(function(x){if(x.on){add('svc_'+x.k,x.l,0,0,0,x.rate*emp,true);L[L.length-1].note='₹'+nf(x.rate,2)+' × '+nf(emp)+' employees'}});
  if(n(sc.addOn)>0){add('svc_add','Additional fixed fees',0,0,n(sc.addOn),0,true);L[L.length-1].note='Fixed monthly'}
  C.L=L;
  C.pTotalM=sum(L.map(function(l){return l.prop}));C.pTotalY=C.pTotalM*12;
  C.savM=C.totalM-C.pTotalM;C.savY=C.savM*12;
  C.savPct=C.totalM>0?C.savM/C.totalM*100:0;
  C.pPerEmpM=emp>0?C.pTotalM/emp:null;
  C.savPerEmp=emp>0?C.perEmpM-C.pPerEmpM:null;
  // five-year plan
  var g=n(sc.growth)/100,inf=n(sc.infl)/100,fe=n(sc.feeEsc)/100,cumC=0,cumP=0;
  C.yrs=[];
  for(var y=0;y<5;y++){
    var gH=Math.pow(1+g,y),gI=Math.pow(1+inf,y),gF=Math.pow(1+fe,y),cy=0,py=0;
    for(var q=0;q<L.length;q++){
      var l=L[q];
      cy+=(l.cf+l.ch*gH)*gI;
      py+=l.fee?(l.pf+l.ph*gH)*gF:(l.pf+l.ph*gH)*gI;
    }
    cy*=12;py*=12;cumC+=cy;cumP+=py;
    C.yrs.push({y:y+1,emp:emp*gH,cur:cy,prop:py,save:cy-py,cumSave:cumC-cumP});
  }
  C.cum5={cur:cumC,prop:cumP,save:cumC-cumP,pct:cumC>0?(cumC-cumP)/cumC*100:0};
  return C;
}

function TI(k,aria,o){
  o=o||{};var v=getP(S,k);
  return '<input class="ti" type="number" inputmode="decimal" min="0" step="any" placeholder="0" aria-label="'+esc(aria)+'" data-k="'+k+'"'+(o.max!=null?' data-max="'+o.max+'"':'')+' value="'+(v?v:'')+'">';
}
function stat(l,id,f,note){return '<div class="stat"><span class="stat-l">'+l+'</span><span class="stat-v" data-out="'+id+'" data-fmt="'+(f||'inr')+'"></span>'+(note?'<span class="stat-n">'+note+'</span>':'')+'</div>'}
function card(t,d,inner,icon,col){
  return '<section class="card" style="--cardc:'+(col||'var(--step)')+'"><h3>'+ibx(icon||'layers',col)+'<span>'+t+'</span></h3>'+(d?'<p class="desc">'+d+'</p>':'')+inner+'</section>';
}
function pageHead(i,title,lede){
  return '<div class="ph">'+ibx(NAVIC[i],STEPCOL[i],true)+'<div><h2 tabindex="-1">'+title+'</h2>'+(lede?'<p class="lede">'+lede+'</p>':'')+'</div></div>';
}
function toolbar(){
  return '<div class="toolbar no-print"><p id="sampleNote"'+(S.meta.sample?'':' hidden')+'>'+ic('info')+'<span>Sample figures are loaded so you can see how the analyzer works. Replace them with your client’s numbers.</span></p>'+
    '<button type="button" data-act="sample">Load sample figures</button><button type="button" data-act="clear">Clear all fields</button></div>';
}
function navBtns(i){
  return '<div class="navbtns no-print">'+(i>0?'<button type="button" class="btn ghost" data-act="goto:'+(i-1)+'">Back</button>':'<span></span>')+
    '<button type="button" class="btn" data-act="goto:'+(i+1)+'">'+(i===NAMES.length-2?'See the dashboard':'Next: '+NAMES[i+1])+'</button></div>';
}

/* ---------- dashboard ---------- */
function segs(c){
  return [
    {l:'People',v:c.people,col:'var(--people)',d:'HR team salaries and recruitment spend, excluding time on manual work'},
    {l:'Technology',v:c.techM,col:'var(--tech)',d:'HRMS, payroll, attendance, biometric, ATS and other HR software'},
    {l:'Vendors',v:c.vendorM,col:'var(--vendor)',d:'Payroll, compliance, recruitment agencies and consultants'},
    {l:'Manual work',v:c.manualCost,col:'var(--manual)',d:'HR salary spent on attendance, payroll prep, queries and reports'},
    {l:'Workforce leakage',v:c.leakM,col:'var(--leak)',d:'Payroll variance, corrections, lost employee time and penalties paid'}
  ];
}
function ringSVG(sg,total){
  var r=90,cx=130,cy=130,circ=2*Math.PI*r,off=0,gap=3,out='';
  sg.forEach(function(s){
    if(s.v<=0||total<=0)return;
    var len=s.v/total*circ,d=Math.max(len-gap,0.5);
    out+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" stroke-width="34" style="stroke:'+s.col+'" stroke-dasharray="'+d.toFixed(2)+' '+(circ-d).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'" transform="rotate(-90 '+cx+' '+cy+')"><title>'+s.l+': '+short(s.v*12)+' a year</title></circle>';
    off+=len;
  });
  return '<svg class="ring" viewBox="0 0 260 260" role="img" aria-label="Where your annual HR cost goes">'+
    '<defs><mask id="reveal" maskUnits="userSpaceOnUse" x="0" y="0" width="260" height="260"><circle class="sweep" cx="'+cx+'" cy="'+cy+'" r="'+r+'" stroke="#fff" stroke-width="40" fill="none" stroke-dasharray="'+circ.toFixed(2)+'" style="--c:'+circ.toFixed(2)+'" transform="rotate(-90 '+cx+' '+cy+')"/></mask></defs>'+
    '<circle class="trk" cx="'+cx+'" cy="'+cy+'" r="'+r+'" stroke-width="34"/>'+
    '<g mask="url(#reveal)">'+out+'</g>'+
    '<text class="rt-s" x="130" y="122" text-anchor="middle">Annual HR cost</text>'+
    '<text class="rt-v" x="130" y="152" text-anchor="middle">'+short(total*12)+'</text></svg>';
}

function saveLocal(rec){
  var list=localSaved();rec.id='L'+Date.now();rec.createdAt=new Date().toISOString();
  list.unshift(rec);
  try{localStorage.setItem(LKEY,JSON.stringify(list.slice(0,200)))}catch(e){return null}
  return rec.id;
}
function saveAnalysis(){
  if(C.totalM<=0){setStatus('There is nothing to save yet.',true);return}
  var rec=buildRecord();
  if(!S.org.client||!String(S.org.client).trim()){setStatus('Please enter the client name first.',true);return}
  if((rec.email||rec.phone)&&!rec.consent){setStatus('Please tick the consent box before saving contact details.',true);return}
  if(rec.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(rec.email)){setStatus('That email address does not look right.',true);return}
  setStatus('Saving…');
  var local=function(why){
    var id=saveLocal(rec);
    if(id){setStatus('Saved on this device only ('+why+'). Reference '+id+'.');updateLocalInfo()}
    else setStatus('Could not save. Browser storage is unavailable.',true);
  };
  if(!API){local('no database connected');return}
  fetch(API,{method:'POST',body:JSON.stringify(rec)})
    .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j}})})
    .then(function(x){
      if(x.ok&&x.j&&x.j.ok)setStatus('Saved to the Get HR Mitra database. Reference #'+x.j.id+'.');
      else if(x.j&&x.j.error)setStatus(x.j.error,true);
      else local('the database did not accept it');
    })
    .catch(function(){local('the database could not be reached')});
}
function csvCell(v){v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function exportLocal(){
  var cols=['createdAt','client','contactName','email','phone','employees','annualCost','hrMitraAnnual','annualSaving','savingPct','fiveYearCurrent','fiveYearHrMitra','fiveYearSaving','notes'];
  var lines=[cols.join(',')].concat(localSaved().map(function(r){return cols.map(function(k){return csvCell(r[k])}).join(',')}));
  try{
    var blob=new Blob([lines.join('\n')],{type:'text/csv'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='get-hr-mitra-saved-analyses.csv';
    document.body.appendChild(a);a.click();a.remove();
  }catch(e){}
}
function loadConfig(){
  if(!API)return;
  fetch(API+'?action=getConfig').then(function(r){return r.json()}).then(function(cfg){
    if(!cfg||!cfg.ok||!cfg.settings)return;
    var st=cfg.settings;
    if(S.meta.cfgVer!==st.version){
      if(st.rates)Object.keys(st.rates).forEach(function(k){if(k in S.scn.rates)S.scn.rates[k]=+st.rates[k]||0});
      if(st.assumptions)['growth','infl','feeEsc'].forEach(function(k){if(k in st.assumptions)S.scn[k]=+st.assumptions[k]||0});
      if(st.addOn!=null)S.scn.addOn=+st.addOn||0;
      S.meta.cfgVer=st.version;save();
    }
    if(st.contact){
      if(st.contact.phone){PHONE_TXT=st.contact.phone;PHONE_TEL=String(st.contact.phone).replace(/[^\d+]/g,'')}
      if(st.contact.email)EMAIL=st.contact.email;
      renderLogo();
    }
    if(cur===6)go(6);
  }).catch(function(){});
}
function loadLayout(){
  if(!API)return;
  fetch(API+'?action=getLayout').then(function(r){return r.json()}).then(function(res){
    if(!res||!res.ok)return;
    if(res.layout&&res.layout.length){
      var byKey={};res.layout.forEach(function(x){byKey[x.key]=true});
      var next=[];
      res.layout.forEach(function(x){
        var def=DEFAULT_LAYOUT.filter(function(d){return d.key===x.key})[0];
        if(def)next.push({key:x.key,label:def.label,visible:x.visible!==false});
      });
      DEFAULT_LAYOUT.forEach(function(d){if(!byKey[d.key])next.push({key:d.key,label:d.label,visible:true})});
      if(next.length)LAYOUT=next;
    }
    if(res.hiddenKpis)HIDDEN_KPI=res.hiddenKpis;
    if(res.hiddenStack)HIDDEN_STACK=res.hiddenStack;
    if(cur===6)go(6);
  }).catch(function(){});
}

  var rows=LAYOUT.map(function(x,i){
    return '<div class="adminrow">'+
      '<input type="checkbox" data-admin-toggle="'+i+'"'+(x.visible?' checked':'')+' aria-label="Show '+esc(x.label)+' to clients">'+
      '<span class="lbl">'+esc(x.label)+'</span>'+
      '<button type="button" data-act="admin-up:'+i+'"'+(i===0?' disabled':'')+' aria-label="Move up">&uarr;</button>'+
      '<button type="button" data-act="admin-down:'+i+'"'+(i===LAYOUT.length-1?' disabled':'')+' aria-label="Move down">&darr;</button>'+
    '</div>';
  }).join('');
  var kpiRows=KPI_LIST.map(function(x){
    var on=HIDDEN_KPI.indexOf(x[0])===-1;
    return '<div class="adminrow"><input type="checkbox" data-admin-kpi="'+x[0]+'"'+(on?' checked':'')+'><span class="lbl">'+esc(x[1])+'</span></div>';
  }).join('');
  var stackRows=STACK_LIST.map(function(x){
    var on=HIDDEN_STACK.indexOf(x[0])===-1;
    return '<div class="adminrow"><input type="checkbox" data-admin-stack="'+x[0]+'"'+(on?' checked':'')+'><span class="lbl">'+esc(x[1])+'</span></div>';
  }).join('');
  return '<div class="adminpanel no-print"><h3 style="margin-top:0">Admin — control what clients see</h3>'+
    '<p class="hint">Toggle whole sections on or off, and reorder with the arrows.</p>'+
    rows+
    '<p class="hint" style="margin-top:16px"><b>Executive dashboard — individual figures</b></p>'+kpiRows+
    '<p class="hint" style="margin-top:16px"><b>Cost stack — individual figures</b></p>'+stackRows+
    '<p class="hint" style="margin-top:14px"><b>Default commercial rates</b>: go to Step 6 (Get HR Mitra plan), set the rates you want every new client to start with, then use the button that appears there while logged in as admin.</p>'+
    '<div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap"><button type="button" class="btn" data-act="admin-save-layout">Save all admin settings</button><button type="button" class="btn ghost" data-act="admin-logout">Log out</button></div>'+
    '<p class="hint" id="adminStatus" style="margin-top:8px"></p></div>';
}
function refreshAdminPanel(){
  var el=document.getElementById('adminPanelHost');
  if(el)el.outerHTML=ADMIN_SESSION.loggedIn?adminPanelHtml():'';
}

/* ---------- rail, nav, refresh ---------- */
function renderRail(){
  var c=C,emp=+S.org.employees||0;
  var items=segs(c).map(function(s){return '<li><i class="sw" style="background:'+s.col+'"></i>'+s.l+'<b>'+short(s.v*12)+'</b></li>'}).join('');
  $('#rail').innerHTML='<p class="rail-l">Running total</p><p class="rail-v">'+short(c.totalY)+'<span> a year</span></p>'+
    '<p class="rail-s">'+short(c.totalM)+' a month'+(emp>0?'. '+inr(c.perEmpM)+' per employee a month.':'.')+'</p>'+
    '<ul class="rail-list">'+items+'</ul><button type="button" class="btn" data-act="goto:6">Open dashboard</button>';
}
function renderNav(){
  $('#stepNav').innerHTML=NAMES.map(function(n,i){
    return '<li style="--c:'+STEPCOL[i]+'"><button type="button" data-act="goto:'+i+'" aria-label="Step '+(i+1)+': '+n+'"'+(i===cur?' aria-current="step"':'')+(i<cur?' class="done"':'')+'>'+ibx(NAVIC[i],STEPCOL[i])+'<span class="nm"><span>'+n+'</span><small>'+SUBS[i]+'</small></span></button></li>';
  }).join('');
  $('#curName').textContent='Step '+(cur+1)+' of '+NAMES.length+': '+NAMES[cur];
}
function refresh(){
  C=compute(S);
  document.querySelectorAll('[data-out]').forEach(function(el){
    var f=el.dataset.fmt||'inr',v=getP(C,el.dataset.out),t=fmt(f,v);
    el.textContent=t;
    if(f==='text')el.hidden=!t;
  });
  renderRail();
  var sn=$('#sampleNote');if(sn)sn.hidden=!S.meta.sample;
  applyName();
}
var STEPS=[s1,s2,s3,s4,s5,s6,s7];
function go(i){
  cur=Math.max(0,Math.min(NAMES.length-1,i));
  C=compute(S);
  document.body.classList.toggle('is-dash',cur===6);
  stage.style.setProperty('--step',STEPCOL[cur]);
  stage.innerHTML=STEPS[cur]();
  renderNav();
  if(cur===5){syncBuilder()}
  else if(cur===6){if(C.totalM>0)renderScn()}
  refresh();
  applyName();
  window.scrollTo(0,0);
  var h=stage.querySelector('h2');if(h){try{h.focus({preventScroll:true})}catch(e){}}
}

/* ---------- events ---------- */
function onInput(e){
  var t=e.target,k=t.dataset&&t.dataset.k;if(!k)return;
  var v;
  if(t.type==='checkbox')v=t.checked;
  else if(t.type==='number'){
    v=t.value===''?0:parseFloat(t.value);if(!isFinite(v)||v<0)v=0;
    if(t.dataset.max!==undefined&&v>+t.dataset.max)v=+t.dataset.max;
  }else v=t.value;
  setP(S,k,v);S.meta.sample=false;save();
  if(k.indexOf('scn.')===0){
    C=compute(S);syncBuilder();applyName();
  }else if(k.indexOf('lead.')===0){
    /* saved above; no recompute needed */
  }else refresh();
}
stage.addEventListener('input',onInput);
stage.addEventListener('change',onInput);
document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act;
  if(a.indexOf('goto:')===0){go(parseInt(a.slice(5),10));save();flashSaveToast()}
  else if(a==='sample'){S=clone(SAMPLE);save();go(cur)}
  else if(a==='clear'){
    if(b.dataset.armed){S=blank();save();go(cur)}
    else{b.dataset.armed='1';b.textContent='Click again to clear everything';
      setTimeout(function(){delete b.dataset.armed;b.textContent='Clear all fields'},3500)}
  }
  else if(a.indexOf('view:')===0){S.ui.view=a.slice(5)==='annual'?'annual':'monthly';save();renderScn()}
  else if(a==='save'){saveAnalysis()}
  else if(a==='export'){exportLocal()}
  else if(a==='print'){try{window.print()}catch(err){}}
  else if(a==='admin-open'){ADMIN_SESSION.loggedIn?null:showAdminModal()}
  else if(a==='admin-close'){closeAdminModal()}
  else if(a==='admin-login'){
    var em=(document.getElementById('admEmail')||{}).value||'';
    var pw=(document.getElementById('admPw')||{}).value||'';
    if(em.trim().toLowerCase()!==ADMIN_EMAIL){showAdminModal('That email is not recognised.');return}
    if(!pw){showAdminModal('Enter the password.');return}
    b.disabled=true;b.textContent='Checking…';
    adminVerify(em.trim(),pw,function(ok,err){
      if(ok){ADMIN_SESSION={loggedIn:true,email:em.trim(),pw:pw};closeAdminModal();updateAdminLinkLabel();if(cur===6)go(6)}
      else showAdminModal(err||'Incorrect password.');
    });
  }
  else if(a==='admin-logout'){ADMIN_SESSION={loggedIn:false,email:'',pw:''};updateAdminLinkLabel();if(cur===6)go(6)}
  else if(a.indexOf('admin-up:')===0){
    var i=parseInt(a.slice(9),10);
    if(i>0){var t=LAYOUT[i-1];LAYOUT[i-1]=LAYOUT[i];LAYOUT[i]=t;refreshAdminPanel();if(cur===6)go(6)}
  }
  else if(a.indexOf('admin-down:')===0){
    var j=parseInt(a.slice(11),10);
    if(j<LAYOUT.length-1){var t2=LAYOUT[j+1];LAYOUT[j+1]=LAYOUT[j];LAYOUT[j]=t2;refreshAdminPanel();if(cur===6)go(6)}
  }
  else if(a==='admin-save-layout'){
    var st=document.getElementById('adminStatus');if(st)st.textContent='Saving…';
    saveLayoutRemote(function(ok,err){
      if(st)st.textContent=ok?'Saved. Every client who opens this tool will now see this layout.':(err||'Could not save.');
    });
  }
  else if(a==='admin-save-rates'){
    var st2=document.getElementById('adminRatesStatus');if(st2)st2.textContent='Saving…';
    saveDefaultRates(function(ok,err){
      if(st2)st2.textContent=ok?'Saved. New visitors will start with these rates.':(err||'Could not save.');
    });
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t&&t.dataset&&t.dataset.adminToggle!==undefined){
    var i=parseInt(t.dataset.adminToggle,10);
    if(LAYOUT[i]){LAYOUT[i].visible=t.checked;if(cur===6)go(6)}
  }
  else if(t&&t.dataset&&t.dataset.adminKpi!==undefined){
    var k=t.dataset.adminKpi,idx=HIDDEN_KPI.indexOf(k);
    if(t.checked&&idx>=0)HIDDEN_KPI.splice(idx,1);
    else if(!t.checked&&idx<0)HIDDEN_KPI.push(k);
    if(cur===6)go(6);
  }
  else if(t&&t.dataset&&t.dataset.adminStack!==undefined){
    var k2=t.dataset.adminStack,idx2=HIDDEN_STACK.indexOf(k2);
    if(t.checked&&idx2>=0)HIDDEN_STACK.splice(idx2,1);
    else if(!t.checked&&idx2<0)HIDDEN_STACK.push(k2);
    if(cur===6)go(6);
  }
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&document.getElementById('adminModalHost')&&document.getElementById('adminModalHost').innerHTML)closeAdminModal();
});

renderLogo();
go(0);
loadConfig();
loadLayout();
})();
</script>
</body>
</html>
